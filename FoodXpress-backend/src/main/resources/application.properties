
spring.application.name=FoodXpress-backend

# MySQL connection
# MySQL connection
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:foodxpress}?sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Razorpay payment gateway
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}


# HikariCP connection pool
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=30000

# Server port
server.port=${PORT:8080}

# Food image upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Food Xpress AI Chatbot
# Food Xpress Chatbot - OpenRouter Free Models
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.api.model=openrouter/free

foodxpress.delivery.earning-per-delivery=${DELIVERY_PARTNER_EARNING_PER_DELIVERY:30.00}

foodxpress.upload-dir=${UPLOAD_DIR:uploads}

foodxpress.bank.encryption-key=${FOODXPRESS_BANK_ENCRYPTION_KEY}

google.client-id=260450590746-av44sq4kdb6rbe23e6ctjf9jqbj2d4na.apps.googleusercontent.com

# ==========================================
# ABANDONED CART REMINDER
# ==========================================

foodxpress.cart.reminder.minutes=10

foodxpress.frontend.url=http://localhost:5173

foodxpress.admin.email=${ADMIN_EMAIL:${spring.mail.username}}